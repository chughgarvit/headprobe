# XcodeGen spec: `brew install xcodegen && xcodegen` creates HeadProbe.xcodeproj from this file.
# (The xtool route uses Package.swift + xtool.yml instead; both build the same sources.)
name: HeadProbe
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "17.0"
targets:
  HeadProbe:
    type: application
    platform: iOS
    sources:
      - path: Sources/HeadProbe
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: HeadProbe
        NSMotionUsageDescription: HeadProbe reads head movement from your earbuds to measure how you turn toward sounds.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.HeadProbe
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
